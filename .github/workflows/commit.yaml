name: Test
on:
  pull_request:
    branches: [main]
    paths-ignore:  # skip when only docs, image assets, or the link-checker change
      - '**/*.md'
      - '.github/assets/**'
      - '.github/workflows/docs.yaml'
  push:
    branches: [main]
    paths-ignore:  # skip when only docs, image assets, or the link-checker change
      - '**/*.md'
      - '.github/assets/**'
      - '.github/workflows/docs.yaml'

env:  # Update this prior to requiring a higher minor version in go.mod
  GO_VERSION: "1.26"

defaults:
  run:  # use bash for all operating systems unless overridden
    shell: bash

concurrency:
  # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#example-using-concurrency-to-cancel-any-in-progress-job-or-run
  group: ${{ github.ref }}-${{ github.workflow }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  check:
    name: Pre-commit check
    runs-on: ubuntu-24.04
    steps:
      - name: Install latest wast2json and wasm-tools
        run: |  # Needed for build.spectest. wabt includes wast2json; wasm-tools is used for exception-handling spectests.
          wabt_version=1.0.39
          wabt_url=https://github.com/WebAssembly/wabt/releases/download/${wabt_version}/wabt-${wabt_version}-linux-x64.tar.gz
          curl -sSL ${wabt_url} | tar --strip-components 2 -C /usr/local/bin -xzf - wabt-${wabt_version}/bin/wast2json
          wasm_tools_version=1.245.1
          wasm_tools_url=https://github.com/bytecodealliance/wasm-tools/releases/download/v${wasm_tools_version}/wasm-tools-${wasm_tools_version}-x86_64-linux.tar.gz
          curl -sSL ${wasm_tools_url} | tar --strip-components 1 -C /usr/local/bin -xzf - wasm-tools-${wasm_tools_version}-x86_64-linux/wasm-tools

      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/setup-go@v6
        with:  # not cache: true as we also need to cache golint
          cache: false
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/go/pkg/mod
            ~/go/bin
          key: check-${{ runner.os }}-go-${{ env.GO_VERSION }}-${{ hashFiles('**/go.sum', 'Makefile') }}

      - run: make build.spectest
        env:  # these targets make eleven GitHub API calls; unauthenticated they hit the hourly cap
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: make check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: ${{ matrix.platform.arch }}, ${{ matrix.platform.os }}, Go-${{ matrix.go-version }}
    runs-on: ${{ matrix.platform.os }}
    needs: spectest_corpus  # for the generated 3.0 cases, which are not committed
    strategy:
      fail-fast: false  # don't fail fast as sometimes failures are arch/OS specific
      matrix:  # Use versions consistent with wazy's Go support policy.
        platform:
        - os: ubuntu-24.04
          arch: amd64
        - os: windows-2025
          arch: amd64
        - os: macos-14
          arch: arm64
        go-version:
          - "1.26"  # Current Go version
          - "1.25"  # Floor Go version of wazy (current - 1)

    steps:

      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - uses: actions/download-artifact@v4
        with:
          name: spectest-v3-corpus
          path: internal/integration_test/spectest/v3/testdata

      # Ensure the pagefile is large enough to execute tests like TestStore_hammer_close on Windows.
      - name: configure Pagefile
        uses: al-cheb/configure-pagefile-action@v1.5
        if: runner.os == 'Windows'
        with:
          minimum-size: 8GB
          maximum-size: 16GB
          disk-root: "D:"

      # Run -race could be really slow without -short, so run them together on this workflow.
      # Since -short is not added in the scratch tests, all the tests are run in CI in practice.
      - run: make test go_test_options='-timeout 20m -race -short'
        env:
          WAZY_SPECTEST_REQUIRE_CASES: "1"  # the corpus came from the artifact; skipping means it did not

      - name: "Generate coverage report"  # only once (not per OS)
        if: runner.os == 'Linux'
        run: make coverage

      - name: "Upload coverage report"  # only on main push and only once (not per OS)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && runner.os == 'Linux'
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: bash <(curl -s https://codecov.io/bash)

  spectest_corpus:
    # The 3.0 corpus is generated from the WebAssembly/testsuite submodule rather than committed, so
    # something has to generate it before the test matrix can run those suites. Doing it once here and
    # publishing it means the matrix does not need wasm-tools on three operating systems.
    name: Build the 3.0 spectest corpus
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install wasm-tools
        run: |
          version=1.245.1
          target=x86_64-linux
          url=https://github.com/bytecodealliance/wasm-tools/releases/download/v${version}/wasm-tools-${version}-${target}.tar.gz
          curl -sSL ${url} | tar --strip-components 1 -C /usr/local/bin -xzf - wasm-tools-${version}-${target}/wasm-tools

      - run: make build.spectest.v3

      - uses: actions/upload-artifact@v4
        with:
          name: spectest-v3-corpus
          path: internal/integration_test/spectest/v3/testdata
          retention-days: 1

  test_scratch:
    name: ${{ matrix.platform.arch }}, Linux (scratch), Go-${{ matrix.go-version }}${{ matrix.platform.no_prot_exec && ', no-prot-exec' }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 30  # a hung test binary must fail fast, never burn the 24h ceiling
    strategy:
      fail-fast: false  # don't fail fast as sometimes failures are arch/OS specific
      matrix:  # Use versions consistent with wazy's Go support policy.
        go-version:
          - "1.26"  # Current Go version
          - "1.25"  # Floor Go version of wazy (current - 1)
        platform:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04
            arch: amd64
            no_prot_exec: true
          - os: ubuntu-24.04-arm
            arch: arm64
          # riscv64 is not here: this job's scratch-container machinery is what
          # hung on that runner. test_riscv64_native runs it with a plain
          # `go test`, and test_riscv64 runs it emulated.

    steps:

      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build test binaries
        run: |
          parent="$(dirname $PWD)/"
          go list -f '{{.Dir}}' ./... | egrep -v 'spectest' | while IFS= read -r pkg; do
          basepath="${pkg#${parent}}"
          echo go test "${pkg}" -c -o "_tests/${basepath}.test"
          go test "${pkg}" -c -o "_tests/${basepath}.test"
          done
          go build -o wazycli ./cmd/wazy
        env:
          GOARCH: ${{ matrix.platform.arch }}
          CGO_ENABLED: 0

      - name: Build scratch container
        run: |
          echo 'FROM scratch' >> Dockerfile
          echo 'CMD ["/test", "-test.v"]' >> Dockerfile
          docker buildx build -t wazy:test --platform linux/${{ matrix.platform.arch }} .

      - name: Write seccomp config
        if: ${{ matrix.platform.no_prot_exec }}
        run: |
          echo '{
            "defaultAction": "SCMP_ACT_ALLOW",
            "syscalls": [
              {
                "names": ["mprotect", "pkey_mprotect", "mmap", "mmap2"],
                "action": "SCMP_ACT_ERRNO",
                "errnoRet": 1,
                "args": [
                  { "index": 2, "value": 4, "valueTwo": 4, "op": "SCMP_CMP_MASKED_EQ" }
                ]
              }
            ]
          }' > no-prot-exec.json

      - name: Run built test binaries
        # This runs all tests compiled above in sequence. Note: This mounts /tmp to allow t.TempDir() in tests.
        run: find _tests -name "*.test" | xargs -t -Itestbin docker run --platform linux/${{ matrix.platform.arch }} -v $(pwd)/testbin:/test -v $(pwd)/wazycli:/wazy -e WAZYCLI=/wazy --tmpfs /tmp ${{ matrix.platform.no_prot_exec && '--security-opt seccomp=$PWD/no-prot-exec.json' }} --rm -t wazy:test

  test_bsd:
    name: amd64, ${{ matrix.os.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false  # don't fail fast as sometimes failures are OS specific
      matrix:
        os:
          - name: freebsd
            version: "14.3"
          - name: openbsd
            version: "7.8"
          - name: netbsd
            version: "10.1"

    steps:
      - uses: actions/checkout@v6

      - name: Build test binaries
        run: |
          parent="$(dirname $PWD)/"
          # spectest/v3 is excluded because its cases are generated rather than embedded, and these
          # binaries run from a directory where the package's testdata is not beside them.
          go list -f '{{.Dir}}' ./... | egrep -v 'imports|sysfs|spectest/v3$' | while IFS= read -r pkg; do
          basepath="${pkg#${parent}}"
          echo go test "${pkg}" -c -o "_tests/${basepath}.test"
          go test "${pkg}" -c -o "_tests/${basepath}.test"
          done
          go build -o wazycli ./cmd/wazy
        env:
          GOOS: ${{ matrix.os.name }}

      - name: Run built test binaries
        uses: cross-platform-actions/action@v0.32.0
        env:
          WAZYCLI: ./wazycli
        with:
          operating_system: ${{ matrix.os.name }}
          version: ${{ matrix.os.version }}
          shell: bash
          sync_files: runner-to-vm
          environment_variables: WAZYCLI
          # This runs all tests compiled above in sequence.
          run: find _tests -name "*.test" | xargs -t -Itestbin nice testbin -test.short -test.v

  # There is no native riscv64 job, and it is not for want of trying.
  #
  # The label upstream wazero uses, ubuntu-24.04-riscv, resolves for them to
  # runners named rise-riscv-runner-* -- real RISC-V hardware donated through
  # RISE (the RISC-V Software Ecosystem) and attached to their org. GitHub does
  # not offer a hosted riscv64 runner; its own machines report as
  # "GitHub Actions <n>", which is what every other job in this file lands on.
  #
  # A label resolves to runners attached to *your* org, so with none attached
  # here the job never gets a machine at all: measured, it sat queued 40
  # minutes with runner="" and was cancelled, while the emulated job beside it
  # was allocated in four. That is what the earlier note meant by "never once
  # completed"; it was right, and the cause is not the job's contents.
  #
  # To get native coverage, wazy needs riscv64 runners attached -- apply to
  # RISE's runner programme for open-source projects, or register a self-hosted
  # riscv64 machine -- and then this job is worth adding back. Until then the
  # emulator is the only option, with the caveats recorded on it.

  # And under the emulator, which is the only place the vector extension is
  # guaranteed present -- so it is where the SIMD and threads suites actually
  # run if the native runner's silicon lacks RVV.
  #
  # Without -one-insn-per-tb, which the test.riscv64 make target carries: that
  # flag guards against qemu-user holding a stale translation of a page the JIT
  # has rewritten, and it costs about 25x -- half an hour here against a couple
  # of minutes. The risk it covers does not vary by suite, so paying it on
  # every push buys little; `make test.riscv64` is the thorough form and is
  # what to run before a release.
  test_riscv64:
    name: riscv64, Linux (qemu)
    runs-on: ubuntu-24.04
    needs: spectest_corpus  # for the generated 3.0 cases, which are not committed
    timeout-minutes: 45  # an emulated run of the whole tree

    steps:

      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - uses: actions/download-artifact@v4
        with:
          name: spectest-v3-corpus
          path: internal/integration_test/spectest/v3/testdata

      # Not the distro's qemu. ubuntu-24.04 ships 8.2.2, which emulates
      # /proc/self/maps without holding mmap_lock: a concurrent mapping change
      # can leave its maps printer looking at a guest mapping absent from its
      # own host snapshot, interval_tree_iter_first() returns null, and the next
      # field access dereferences it. Anything that writes a CPU or heap profile
      # reaches it, because runtime/pprof's profile builder reads that file --
      # which made cmd/wazy die with "QEMU internal SIGSEGV {code=MAPERR,
      # addr=0x20}" about one run in six.
      #
      # Upstream fix bbd5630a75e7, backported as dad762774e, released in 8.2.8.
      # Ubuntu has not backported it to noble at any patch level (checked
      # through 8.2.2+ds-0ubuntu1.18), so take a fixed build instead. Measured
      # locally on the same test binaries: 8.2.2 fails 1 run in 10, 9.2.1 zero
      # in 30. The binary is static-pie linked, so it needs nothing else.
      # Two things are needed, and the second is easy to miss. The distro
      # package registers the binfmt_misc handlers, which is what lets a test
      # exec a riscv64 binary -- examples/cli and the wasi cat example both run
      # the CLI as a subprocess, and without a handler that is "exit status 1".
      # Then the 9.2.1 binary replaces the one the handler points at, so the
      # explicit -exec and the binfmt path both get the fixed emulator.
      - name: Install a qemu carrying the /proc/self/maps fix
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-user-static
          deb=qemu-user_9.2.1+ds-1ubuntu5_amd64.deb
          curl -fsSL -o "$deb" "http://archive.ubuntu.com/ubuntu/pool/universe/q/qemu/$deb"
          dpkg -x "$deb" "$PWD/.qemu"
          sudo cp "$PWD/.qemu/usr/bin/qemu-riscv64" /usr/bin/qemu-riscv64-static
          qemu-riscv64-static --version
          # Fail here, not thirty minutes later, if the handler is missing.
          test -e /proc/sys/fs/binfmt_misc/qemu-riscv64

      # The CLI, cross-built, so the two examples that shell out to it run that
      # instead of `go run` -- which every other cross-architecture job in this
      # file already does for the same reason.
      - name: Cross-build the CLI for the examples that exec it
        run: go build -o "$PWD/wazycli" ./cmd/wazy
        env:
          GOARCH: riscv64
          CGO_ENABLED: 0

      # The whole tree, not a chosen subset. Every defect this backend has had
      # since the spec suites went green was outside them: the API's []uint64
      # encoding, a v128 crossing into a host function, a trampoline that spun
      # on a large signature, and a segfault that only a TinyGo binary's
      # register pressure produced. A subset would have caught none of them.
      - name: The tree, on the riscv64 backend
        run: go test -p 1 -timeout 40m -exec qemu-riscv64-static ./...
        env:
          GOARCH: riscv64
          CGO_ENABLED: 0
          WAZYCLI: ${{ github.workspace }}/wazycli
          # SIMD and threads are gated on RVV, and without it every suite from
          # v2 up skips itself and still reports ok. This makes that loud.
          WAZY_RISCV64_REQUIRE_V: "1"
          WAZY_SPECTEST_REQUIRE_CASES: "1"  # the corpus came from the artifact; skipping means it did not

  test_vm:
    name: amd64, ${{ matrix.os.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false  # don't fail fast as sometimes failures are OS specific
      matrix:
        os:
          - name: dragonfly
            version: "6.4.2"
            action: 'vmactions/dragonflybsd-vm@v1'
          - name: illumos
            version: "r151054"
            action: 'vmactions/omnios-vm@v1'

    steps:
      - uses: actions/checkout@v6

      - name: Build test binaries
        run: |
          parent="$(dirname $PWD)/"
          # spectest/v3 is excluded because its cases are generated rather than embedded, and these
          # binaries run from a directory where the package's testdata is not beside them.
          go list -f '{{.Dir}}' ./... | egrep -v 'imports|sysfs|spectest/v3$' | while IFS= read -r pkg; do
          basepath="${pkg#${parent}}"
          echo go test "${pkg}" -c -o "_tests/${basepath}.test"
          go test "${pkg}" -c -o "_tests/${basepath}.test"
          done
          go build -o wazycli ./cmd/wazy
          envsubst < ./.github/actions/vmactions/template.yml > ./.github/actions/vmactions/action.yml
        env:
          GOOS: ${{ matrix.os.name }}
          VMACTIONS: ${{ matrix.os.action }}

      - name: Run built test binaries
        uses: ./.github/actions/vmactions
        env:
          WAZYCLI: ./wazycli
        with:
          envs: WAZYCLI
          # This runs all tests compiled above in sequence.
          run: find _tests -name "*.test" | xargs -t -Itestbin nice testbin -test.short -test.v

  # This ensures that internal/integration_test/fuzz is runnable, and is not intended to
  # run full-length fuzzing while trying to find low-hanging frontend bugs.
  fuzz:
    name: Minimal Fuzzing (${{ matrix.platform.os }}, ${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false  # don't fail fast as sometimes failures are arch/OS specific
      matrix:  # Use versions consistent with wazy's Go support policy.
        platform:
          - os: ubuntu-24.04
            arch: amd64
          - os: macos-14
            arch: arm64

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/cache@v5
        id: cache
        with:
          # Cache corpus and artifacts so that we don't start from scratch but rather with a meaningful corpus
          # in the subsequent CI jobs.
          path: |
            ~/.cargo
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.rustup/toolchains/
            internal/integration_test/fuzz/target
            internal/integration_test/fuzz/fuzz/artifacts
            internal/integration_test/fuzz/fuzz/corpus
          key: build-fuzz-${{ matrix.platform.os }}-${{ matrix.platform.arch }}-go-${{ env.GO_VERSION }}-${{ hashFiles('**/go.sum', 'Makefile', '**/Cargo.lock', '**/Cargo.toml', '**/*.rs') }}

      - run: cargo install cargo-fuzz
        if: steps.cache.outputs.cache-hit != 'true'
      # Run fuzzing only for a minute, not a full-length intensive one, but 60 seconds seems enough to find minor "front-end"
      # bugs which might exist in binary parser, validation, or instantiation phase while not pressuring CI jobs.
      - run: make fuzz fuzz_timeout_seconds=60
        if: ${{ github.event_name  == 'pull_request' }}
      # Run a bit longer on main branch push!
      - run: make fuzz fuzz_timeout_seconds=180
        if: ${{ github.event_name  == 'push' }}
