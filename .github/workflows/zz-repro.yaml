# Diagnostic harness for the open Windows *Instance teardown corruption
# (TODOS.md, "## OPEN BUG"). Manual-dispatch only -- it costs nothing until
# someone asks for it, and it never fires on push.
#
# Why CI rather than a local box: the bug does not reproduce on Linux at all
# (~10k iterations clean), and it does not reproduce on a real Windows 10
# laptop either -- ~1600 process starts across plain, GOGC=1, clobberfree,
# gccheckmark, GOMAXPROCS 2, 48-way oversubscription and both Go 1.26 patch
# levels, all clean. It needs this runner image.
#
# WHAT THIS MEASURES, and why it changed shape. Every crash captured so far
# died between 0.01s and 0.115s -- inside a -count=2500 run, i.e. during its
# FIRST iteration. The unit of risk is a PROCESS START, not an iteration:
# 4 dispatches produced 9 crashes from ~64 starts, about 1 in 7. Cranking
# -count bought nothing, because each shard was a single sample.
#
# So each shard now launches MANY short processes and reports crashes/starts.
# A dispatch yields a rate instead of a coin flip, which is what a bisect
# needs as an oracle. The four modes differ only in -count, to calibrate
# which value maximises the rate; once known, collapse to that one.
#
# Capture rule (learned the hard way): never inline `head` of a crash log. The
# clobberfree crash OPENS with a GC span dump of hundreds of "alloc unmarked"
# lines, which ate the entire budget and threw away the stack trace behind it.
# Upload raw logs as artifacts (not truncated) and strip the span dump before
# inlining anything.
name: zz-repro

on:
  workflow_dispatch:
    inputs:
      starts_scale:
        description: "multiplier on each mode's process-start budget"
        default: "1"

jobs:
  windows-stress:
    name: win ${{ matrix.mode }} ${{ matrix.shard }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        mode: [c1, c5, c50, c500]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: configure Pagefile
        uses: al-cheb/configure-pagefile-action@v1.5
        with:
          minimum-size: 8GB
          maximum-size: 16GB
          disk-root: "D:"

      - name: measure the crash rate per process start
        shell: bash
        env:
          # `system`, not `all`: `all` hides runtime-internal goroutines, and a
          # finalizer goroutine was the thing we most needed to see. It is what
          # showed that the "concurrent map read and map write" crashes have no
          # concurrent writer at all.
          GOTRACEBACK: system
        run: |
          set -u
          scale="${{ github.event.inputs.starts_scale || '1' }}"
          case "${{ matrix.mode }}" in
            c1)   COUNT=1;   STARTS=$((600 * scale)) ;;
            c5)   COUNT=5;   STARTS=$((300 * scale)) ;;
            c50)  COUNT=50;  STARTS=$((60  * scale)) ;;
            c500) COUNT=500; STARTS=$((12  * scale)) ;;
          esac
          go version
          # Build ONCE; every start then measures the runtime, not the compiler.
          go test -c -o instance.test.exe ./internal/component/instance/
          mkdir -p crashes
          crashes=0
          for i in $(seq 1 "$STARTS"); do
            set +e
            ./instance.test.exe \
              -test.run 'TestAsyncWastConformance/trap-if-sync-and-waitable-set' \
              -test.count="$COUNT" -test.timeout=5m > run.log 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              crashes=$((crashes + 1))
              cp run.log "crashes/crash-$crashes.log"
              # Three samples is plenty to characterise a mode; keep the shard short.
              [ "$crashes" -ge 3 ] && break
            fi
          done
          printf 'mode=%s count=%s starts=%s crashes=%s\n' \
            "${{ matrix.mode }}" "$COUNT" "$i" "$crashes" | tee rate.txt

      - name: upload crash logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.mode }}-${{ matrix.shard }}
          path: |
            crashes/
            rate.txt
          retention-days: 14
          if-no-files-found: ignore

      - name: summarize
        if: always()
        shell: bash
        run: |
          cat rate.txt 2>/dev/null || echo "no rate recorded"
          for f in crashes/*.log; do
            [ -e "$f" ] || continue
            echo "===== $f ====="
            # Strip the GC span dump; it is hundreds of uninformative lines and
            # it is what swallowed the stack trace the first time round.
            grep -vE '^0x[0-9a-f]+ +(alloc|free) +(un)?marked$' "$f" > trimmed.log
            start=$(grep -nE 'fatal error|panic:|marked free object|Exception 0x' trimmed.log | head -1 | cut -d: -f1)
            if [ -n "$start" ]; then
              tail -n "+$start" trimmed.log | head -n 120
            else
              tail -n 60 trimmed.log
            fi
          done
