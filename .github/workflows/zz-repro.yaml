# Diagnostic harness for the open Windows *Instance teardown corruption
# (TODOS.md, "## OPEN BUG"). Manual-dispatch only -- it costs nothing until
# someone asks for it, and it never fires on push.
#
# Why CI rather than a local box: the bug does not reproduce on Linux at all
# (~10k iterations clean), and it does not reproduce on a real Windows 10
# laptop either -- ~1600 process starts across plain, GOGC=1, clobberfree,
# gccheckmark, GOMAXPROCS 2, 48-way oversubscription and both Go 1.26 patch
# levels, all clean. It needs this runner image.
#
# WHAT THIS MEASURES, and why it keeps changing shape.
#
# 1. Every crash dies between 0.01s and 0.115s -- inside a -count=2500 run,
#    i.e. during its FIRST iteration. The unit of risk is a PROCESS START,
#    not an iteration, so cranking -count bought nothing.
# 2. Crashes are a property of the MACHINE, not a probability. In one
#    dispatch a single shard crashed 3 times in its first 4 launches while
#    the other 15 shards were clean across 2888 launches. Runners are either
#    poisoned (crashes almost every launch) or clean (never crashes).
#
# (2) means comparing modes ACROSS shards compares machines, not modes --
# which silently invalidated three earlier "discriminator" sweeps. So each
# shard now PROBES its own runner first and only sweeps the modes if that
# runner turns out to be poisoned, keeping every comparison on one box.
# The fingerprint step exists to correlate poisoned-ness with CPU/host.
#
# Capture rule (learned the hard way): never inline `head` of a crash log. The
# clobberfree crash OPENS with a GC span dump of hundreds of "alloc unmarked"
# lines, which ate the entire budget and threw away the stack trace behind it.
# Upload raw logs as artifacts (not truncated) and strip the span dump before
# inlining anything.
name: zz-repro

on:
  workflow_dispatch:
    inputs:
      starts_scale:
        description: "multiplier on each mode's process-start budget"
        default: "1"

jobs:
  windows-stress:
    name: win ${{ matrix.mode }} ${{ matrix.shard }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        mode: [a, b, c, d]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: configure Pagefile
        uses: al-cheb/configure-pagefile-action@v1.5
        with:
          minimum-size: 8GB
          maximum-size: 16GB
          disk-root: "D:"

      - name: fingerprint this runner
        shell: pwsh
        run: |
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          $os  = Get-CimInstance Win32_OperatingSystem
          $cs  = Get-CimInstance Win32_ComputerSystem
          @(
            "cpu_name=$($cpu.Name)"
            "cpu_id=$($cpu.ProcessorId)"
            "cores=$($cpu.NumberOfCores) logical=$($cpu.NumberOfLogicalProcessors)"
            "caption=$($os.Caption) build=$($os.BuildNumber) ver=$($os.Version)"
            "manufacturer=$($cs.Manufacturer) model=$($cs.Model)"
            "hypervisor=$($cs.HypervisorPresent)"
            "ram_gb=$([math]::Round($cs.TotalPhysicalMemory/1GB,1))"
          ) | Tee-Object -FilePath fingerprint.txt

      - name: probe, then sweep every mode ON THIS SAME RUNNER
        shell: bash
        env:
          GOTRACEBACK: system
        run: |
          set -u
          # Crash counts are a property of the MACHINE, not of a probability:
          # one shard of a previous dispatch crashed 3 times in its first 4
          # launches while 15 shards were clean across 2888 launches. So every
          # mode must be compared on ONE runner -- comparing across shards
          # compares machines, not modes, which invalidated the earlier sweeps.
          go version
          go test -c -o instance.test.exe ./internal/component/instance/
          mkdir -p crashes
          RUN='TestAsyncWastConformance/trap-if-sync-and-waitable-set'

          launch() {  # launch <tag> <n>; echoes crash count
            local tag="$1" n="$2" c=0 i
            for i in $(seq 1 "$n"); do
              set +e
              ./instance.test.exe -test.run "$RUN" -test.count=1 -test.timeout=2m \
                > "run.log" 2>&1
              local rc=$?
              set -e
              if [ "$rc" -ne 0 ]; then
                c=$((c+1))
                [ "$c" -le 2 ] && cp run.log "crashes/$tag-$c.log"
              fi
            done
            echo "$c"
          }

          probe=$(launch probe 25)
          echo "probe=$probe/25" | tee -a rate.txt
          if [ "$probe" -eq 0 ]; then
            echo "CLEAN RUNNER -- skipping the sweep" | tee -a rate.txt
            exit 0
          fi
          echo "POISONED RUNNER -- sweeping on this box" | tee -a rate.txt

          # Poisoned-ness tracks the CPU: every Intel Xeon Platinum 8573C
          # (Emerald Rapids) runner reproduces at ~80%, every AMD EPYC runner
          # sits at 0%. The interpreter corrupts as readily as the JIT, so this
          # is not wazy codegen -- it points at CPU-feature-gated code in the
          # Go runtime (memmove / memclr / GC scan). GODEBUG=cpu.*=off disables
          # those paths one at a time.
          n=25
          for feat in cpu.all=off cpu.avx512f=off cpu.avx2=off cpu.erms=off; do
            export GODEBUG="$feat"
            echo "$feat -> $(launch "${feat%%=*}-off" $n)/$n" | tee -a rate.txt
            unset GODEBUG
          done

          # Control: is this machine corrupting ANY Go program, or only wazy?
          # .github/gcstress has no wazy in it -- just a pointer-dense heap and
          # forced GCs. If it corrupts here too, the fault is not in this repo.
          go build -o gcstress.exe ./.github/gcstress
          c=0
          for i in $(seq 1 40); do
            set +e; GOGC=1 ./gcstress.exe > ctl.log 2>&1; rc=$?; set -e
            if [ "$rc" -ne 0 ]; then
              c=$((c+1)); [ "$c" -le 2 ] && cp ctl.log "crashes/gcstress-$c.log"
            fi
          done
          echo "gcstress_no_wazy=$c/40" | tee -a rate.txt

      - name: upload crash logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.mode }}-${{ matrix.shard }}
          path: |
            crashes/
            rate.txt
            fingerprint.txt
          retention-days: 14
          if-no-files-found: ignore

      - name: summarize
        if: always()
        shell: bash
        run: |
          cat rate.txt 2>/dev/null || echo "no rate recorded"
          for f in crashes/*.log; do
            [ -e "$f" ] || continue
            echo "===== $f ====="
            # Strip the GC span dump; it is hundreds of uninformative lines and
            # it is what swallowed the stack trace the first time round.
            grep -vE '^0x[0-9a-f]+ +(alloc|free) +(un)?marked$' "$f" > trimmed.log
            start=$(grep -nE 'fatal error|panic:|marked free object|Exception 0x' trimmed.log | head -1 | cut -d: -f1)
            if [ -n "$start" ]; then
              tail -n "+$start" trimmed.log | head -n 120
            else
              tail -n 60 trimmed.log
            fi
          done
