# TEMPORARY: reproduction harness for the intermittent Windows crash in
# TestAsyncWastConformance/trap-if-sync-and-waitable-set. Deleted before this
# branch merges -- it exists only to turn a ~1-in-15 CI flake into a signal we
# can iterate on.
#
# The matrix is a discriminator, not just a stressor:
#   native      - baseline, reproduces the crash
#   interpreter - same test with the JIT swapped out. If the crash survives it
#                 is in this package's Go; if it vanishes it is in generated code.
#   clobber     - GODEBUG=clobberfree=1 + GOGC=1, so a use-after-free faults at
#                 the culprit instead of at some later victim.
name: zz-repro

on:
  push:
    branches:
      - fix/async-wast-close-crash
  workflow_dispatch:

jobs:
  windows-stress:
    name: win ${{ matrix.mode }} ${{ matrix.shard }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        mode: [native, interpreter, clobber]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: configure Pagefile
        uses: al-cheb/configure-pagefile-action@v1.5
        with:
          minimum-size: 8GB
          maximum-size: 16GB
          disk-root: "D:"

      - name: stress the async wast suite
        shell: bash
        env:
          GOTRACEBACK: all
        run: |
          case "${{ matrix.mode }}" in
            native)      flags="-count=2500" ;;
            interpreter) flags="-count=2500"; export WAZY_REPRO_INTERPRETER=1 ;;
            clobber)     flags="-count=1200"; export GODEBUG=clobberfree=1; export GOGC=1 ;;
          esac
          set +e
          go test ./internal/component/instance/ \
            -run 'TestAsyncWastConformance' \
            -timeout 55m $flags > out.log 2>&1
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo "===== head ====="
            head -n 160 out.log
            echo "===== REPRO markers ====="
            grep -n "REPRO:" out.log || true
          fi
          exit $rc
