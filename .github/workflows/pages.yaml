name: Pages

on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/pages.yaml']
  pull_request:
    branches: [main]
    paths: ['website/**', '.github/workflows/pages.yaml']
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Check internal links
        run: npm run check:links
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist

  deploy:
    name: Deploy
    # Only main publishes; pull requests stop after the build above.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
